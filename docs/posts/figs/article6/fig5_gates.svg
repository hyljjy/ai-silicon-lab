<svg xmlns="http://www.w3.org/2000/svg" width="720" height="702" viewBox="0 0 720 702" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<rect width="720" height="702" fill="#fcfcfb"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="36" y="58" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">依据工具输出判假设，要过两关</text><rect x="36" y="96" width="648" height="294" rx="10" fill="#dbe8f8" stroke="none" stroke-width="2"/><text x="58" y="142" font-size="28" fill="#2a78d6" font-weight="700" text-anchor="start">第一关：通用五项</text><text x="58" y="188" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start">工具正常结束</text><text x="58" y="226" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start">日志没有 Error（严格模式：无未审阅 Warning）</text><text x="58" y="264" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start">输出非空</text><text x="58" y="302" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start">查的对象对得上</text><text x="58" y="340" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start">环境核对已通过</text><text x="662" y="142" font-size="26" fill="#2a78d6" font-weight="700" text-anchor="end">H6 过了</text><line x1="360" y1="394" x2="360" y2="440" stroke="#52514e" stroke-width="3" marker-end="url(#arr)"/><rect x="36" y="446" width="648" height="136" rx="10" fill="#fbe3d8" stroke="none" stroke-width="2"/><text x="58" y="492" font-size="28" fill="#eb6834" font-weight="700" text-anchor="start">第二关：这条假设自己的判定条件</text><text x="58" y="538" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start">H6 的第一句：先确认对照生效</text><text x="662" y="562" font-size="26" fill="#eb6834" font-weight="700" text-anchor="end">H6 卡在这里</text><line x1="360" y1="586" x2="360" y2="632" stroke="#52514e" stroke-width="3" marker-end="url(#arr)"/><text x="360" y="672" font-size="28" fill="#0b0b0b" font-weight="700" text-anchor="middle">支持 / 反对 / 未判定</text>
</svg>
