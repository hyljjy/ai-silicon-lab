<text x="36" y="58" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">先看对照有没有生效</text><text x="36" y="100" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">看被改的那一级：in_b[2] 端口的延迟</text><rect x="36" y="130" width="648" height="104" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="58" y="174" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">原报告</text><text x="58" y="212" font-size="23" fill="#52514e" font-weight="400" text-anchor="start">基线</text><text x="662" y="196" font-size="34" fill="#0b0b0b" font-weight="700" text-anchor="end">0.3091 ns</text><rect x="36" y="250" width="648" height="104" rx="10" fill="#dbe8f8" stroke="none" stroke-width="2"/><text x="58" y="294" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">set_drive 0 本该得到</text><text x="58" y="332" font-size="23" fill="#52514e" font-weight="400" text-anchor="start">判定条件写的生效标志</text><text x="662" y="316" font-size="34" fill="#2a78d6" font-weight="700" text-anchor="end">约 0 ns</text><rect x="36" y="370" width="648" height="104" rx="10" fill="#fbe3d8" stroke="none" stroke-width="2"/><text x="58" y="414" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">实际跑出来</text><text x="58" y="452" font-size="23" fill="#52514e" font-weight="400" text-anchor="start">slack 也还是 −4.1897 ns</text><text x="662" y="436" font-size="34" fill="#eb6834" font-weight="700" text-anchor="end">0.3091 ns</text><text x="36" y="524" font-size="26" fill="#52514e" font-weight="400" text-anchor="start">这一级没变，对照没生效：记未判定。</text>
