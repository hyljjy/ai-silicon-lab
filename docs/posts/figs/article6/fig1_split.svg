<text x="36" y="58" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">判定这句话需要什么</text><text x="36" y="100" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">不看写在哪，也不看语气</text><rect x="36" y="130" width="648" height="134" rx="10" fill="#dbe8f8" stroke="none" stroke-width="2"/><text x="58" y="174" font-size="25" fill="#0b0b0b" font-weight="700" text-anchor="start">_11509_ 的 fanout 为 31</text><text x="58" y="214" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">写在事实部分</text><text x="58" y="248" font-size="23" fill="#52514e" font-weight="400" text-anchor="start">报告里直接读到</text><text x="662" y="214" font-size="30" fill="#2a78d6" font-weight="700" text-anchor="end">事实</text><rect x="36" y="278" width="648" height="134" rx="10" fill="#fbe3d8" stroke="none" stroke-width="2"/><text x="58" y="322" font-size="25" fill="#0b0b0b" font-weight="700" text-anchor="start">_11509_ 是饱和判断</text><text x="58" y="362" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">规程举的例子</text><text x="58" y="396" font-size="23" fill="#52514e" font-weight="400" text-anchor="start">材料没有网表，对不上 RTL</text><text x="662" y="362" font-size="30" fill="#eb6834" font-weight="700" text-anchor="end">假设</text><rect x="36" y="426" width="648" height="134" rx="10" fill="#dbe8f8" stroke="none" stroke-width="2"/><text x="58" y="470" font-size="25" fill="#0b0b0b" font-weight="700" text-anchor="start">buf_2 驱动 19 个负载只耗时 0.309 ns</text><text x="58" y="510" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">写在假设部分</text><text x="58" y="544" font-size="23" fill="#52514e" font-weight="400" text-anchor="start">报告一行写全，再比大小</text><text x="662" y="510" font-size="30" fill="#2a78d6" font-weight="700" text-anchor="end">事实</text><rect x="36" y="574" width="648" height="134" rx="10" fill="#fbe3d8" stroke="none" stroke-width="2"/><text x="58" y="618" font-size="25" fill="#0b0b0b" font-weight="700" text-anchor="start">_12026_ 是 out_data[0] 的输出寄存器</text><text x="58" y="658" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">写在事实部分</text><text x="58" y="692" font-size="23" fill="#52514e" font-weight="400" text-anchor="start">要看网表</text><text x="662" y="658" font-size="30" fill="#eb6834" font-weight="700" text-anchor="end">假设</text>
</svg>
