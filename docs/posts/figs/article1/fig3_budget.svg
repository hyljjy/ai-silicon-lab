e="alphabetic">实际到达 31.54</text><rect x="849.59185" y="390" width="119.40930000000003" height="16" rx="4" fill="#eb6834"/><text x="909.3249999999999" y="445" font-size="28" fill="#eb6834" font-weight="700" text-anchor="middle" dominant-baseline="alphabetic">晚了 4.19 ns</text><text x="909.3249999999999" y="480" font-size="24" fill="#eb6834" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">setup slack = −4.19</text><text x="60" y="560" font-size="24" fill="#52514e" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">setup slack = 要求的最晚到达时刻 − 实际到达时刻；负数就是没赶上。</text><text x="60" y="596" font-size="24" fill="#52514e" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">综合后、理想时钟、不计布线电阻电容（计引脚和输出负载）。</text>
