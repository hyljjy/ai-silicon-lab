<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="610" viewBox="0 0 1080 610" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<rect width="1080" height="610" fill="#fcfcfb"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
<marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs>
<text x="60" y="70" font-size="38" fill="#0b0b0b" font-weight="700" text-anchor="start" dominant-baseline="alphabetic">同一条路径，几组对照的 setup slack（ns）</text><line x1="480" y1="120" x2="480" y2="450" stroke="#e4e3df" stroke-width="1.5"/><text x="480" y="484" font-size="22" fill="#8a8986" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">−4</text><line x1="600" y1="120" x2="600" y2="450" stroke="#e4e3df" stroke-width="1.5"/><text x="600" y="484" font-size="22" fill="#8a8986" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">−2</text><line x1="720" y1="120" x2="720" y2="450" stroke="#e4e3df" stroke-width="1.5"/><text x="720" y="484" font-size="22" fill="#8a8986" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">0</text><line x1="840" y1="120" x2="840" y2="450" stroke="#e4e3df" stroke-width="1.5"/><text x="840" y="484" font-size="22" fill="#8a8986" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">+2</text><text x="60" y="164" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">原来</text><text x="60" y="192" font-size="20" fill="#52514e" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">基线</text><rect x="468.59999999999997" y="130" width="251.40000000000003" height="50" rx="4" fill="#8a8986"/><text x="458.59999999999997" y="165" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="end" dominant-baseline="alphabetic">−4.19</text><text x="60" y="244" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">输入外部延迟清零</text><text x="60" y="272" font-size="20" fill="#eb6834" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">改约束</text><rect x="720" y="210" width="83.39999999999998" height="50" rx="4" fill="#eb6834"/><text x="813.4" y="245" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start" dominant-baseline="alphabetic">+1.39</text><text x="60" y="324" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">周期 33.15、外部延迟 6.63</text><text x="60" y="352" font-size="20" fill="#eb6834" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">改约束</text><rect x="720" y="290" width="4" height="50" rx="4" fill="#eb6834"/><text x="734" y="325" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start" dominant-baseline="alphabetic">+0.002</text><text x="60" y="404" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">37 个单元全换强驱动</text><text x="60" y="432" font-size="20" fill="#2a78d6" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">改电路</text><rect x="592.8" y="370" width="127.20000000000005" height="50" rx="4" fill="#2a78d6"/><text x="582.8" y="405" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="end" dominant-baseline="alphabetic">−2.12</text><line x1="720" y1="120" x2="720" y2="450" stroke="#52514e" stroke-width="2.5"/><text x="60" y="540" font-size="24" fill="#52514e" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">改约束的两组转正了，但 RTL 没变、电路没变，只是检查条件变了，不能算优化。</text><text x="60" y="576" font-size="24" fill="#52514e" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">改电路的这组（只换单元尺寸）仍然违例。流水方案的效果要到阶段 B 才验证。</text>
</svg>
