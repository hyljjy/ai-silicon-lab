<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="710" viewBox="0 0 1080 710" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<rect width="1080" height="710" fill="#fcfcfb"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
<marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs>
<text x="60" y="70" font-size="38" fill="#0b0b0b" font-weight="700" text-anchor="start" dominant-baseline="alphabetic">把驱动 X 的单元换强以后</text><rect x="60" y="120" width="170" height="80" rx="10" fill="#dbe8f8" stroke="#2a78d6" stroke-width="2"/><text x="145" y="172" font-size="28" fill="#0b0b0b" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">信号 X</text><rect x="60" y="230" width="170" height="80" rx="10" fill="#fbe3d8" stroke="#eb6834" stroke-width="2"/><text x="145" y="282" font-size="28" fill="#0b0b0b" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">信号 Y</text><line x1="232" y1="160" x2="330" y2="128" stroke="#2a78d6" stroke-width="1.5"/><line x1="232" y1="270" x2="330" y2="238" stroke="#eb6834" stroke-width="1.5"/><line x1="232" y1="160" x2="330" y2="144" stroke="#2a78d6" stroke-width="1.5"/><line x1="232" y1="270" x2="330" y2="254" stroke="#eb6834" stroke-width="1.5"/><line x1="232" y1="160" x2="330" y2="160" stroke="#2a78d6" stroke-width="1.5"/><line x1="232" y1="270" x2="330" y2="270" stroke="#eb6834" stroke-width="1.5"/><line x1="232" y1="160" x2="330" y2="176" stroke="#2a78d6" stroke-width="1.5"/><line x1="232" y1="270" x2="330" y2="286" stroke="#eb6834" stroke-width="1.5"/><line x1="232" y1="160" x2="330" y2="192" stroke="#2a78d6" stroke-width="1.5"/><line x1="232" y1="270" x2="330" y2="302" stroke="#eb6834" stroke-width="1.5"/><text x="345" y="172" font-size="24" fill="#52514e" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">驱动 31 个输出位</text><text x="345" y="282" font-size="24" fill="#52514e" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">也驱动 31 个负载</text><text x="640" y="172" font-size="24" fill="#2a78d6" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">换强了：经过 X 的路径变好</text><text x="640" y="282" font-size="24" fill="#eb6834" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">最差位置转到了 Y 这一支</text><line x1="380" y1="400" x2="380" y2="580" stroke="#e4e3df" stroke-width="1.5"/><text x="380" y="615" font-size="22" fill="#8a8986" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">0.0</text><line x1="495" y1="400" x2="495" y2="580" stroke="#e4e3df" stroke-width="1.5"/><text x="495" y="615" font-size="22" fill="#8a8986" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">0.5</text><line x1="610" y1="400" x2="610" y2="580" stroke="#e4e3df" stroke-width="1.5"/><text x="610" y="615" font-size="22" fill="#8a8986" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">1.0</text><line x1="725" y1="400" x2="725" y2="580" stroke="#e4e3df" stroke-width="1.5"/><text x="725" y="615" font-size="22" fill="#8a8986" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">1.5</text><line x1="840" y1="400" x2="840" y2="580" stroke="#e4e3df" stroke-width="1.5"/><text x="840" y="615" font-size="22" fill="#8a8986" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">2.0</text><line x1="955" y1="400" x2="955" y2="580" stroke="#e4e3df" stroke-width="1.5"/><text x="955" y="615" font-size="22" fill="#8a8986" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">2.5</text><text x="985" y="615" font-size="22" fill="#8a8986" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">ns</text><text x="60" y="450" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">原来那条路径改善</text><rect x="380" y="410" width="529" height="56" rx="4" fill="#2a78d6"/><text x="921" y="450" font-size="28" fill="#0b0b0b" font-weight="700" text-anchor="start" dominant-baseline="alphabetic">2.30</text><text x="60" y="535" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">全设计最差改善</text><rect x="380" y="495" width="154.10000000000002" height="56" rx="4" fill="#eb6834"/><text x="546.1" y="535" font-size="28" fill="#0b0b0b" font-weight="700" text-anchor="start" dominant-baseline="alphabetic">0.67</text><line x1="610" y1="340" x2="610" y2="590" stroke="#0b0b0b" stroke-width="3" stroke-dasharray="10 7"/><text x="622" y="348" font-size="22" fill="#0b0b0b" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">Claude 自己写的门槛：</text><text x="622" y="376" font-size="22" fill="#0b0b0b" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">最差 slack 改善不到 1 ns 就推翻</text><text x="60" y="670" font-size="26" fill="#52514e" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">只盯着一条路径看是不够的，要看全设计的最差值有没有动。</text>
</svg>
