<svg xmlns="http://www.w3.org/2000/svg" width="720" height="676" viewBox="0 0 720 676" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<rect width="720" height="676" fill="#fcfcfb"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="36" y="58" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">把驱动 X 的单元换强以后</text><rect x="36" y="100" width="150" height="76" rx="10" fill="#dbe8f8" stroke="#2a78d6" stroke-width="2"/><text x="111" y="150" font-size="30" fill="#0b0b0b" font-weight="400" text-anchor="middle">信号 X</text><line x1="188" y1="138" x2="250" y2="106" stroke="#2a78d6" stroke-width="1.5"/><line x1="188" y1="138" x2="250" y2="122" stroke="#2a78d6" stroke-width="1.5"/><line x1="188" y1="138" x2="250" y2="138" stroke="#2a78d6" stroke-width="1.5"/><line x1="188" y1="138" x2="250" y2="154" stroke="#2a78d6" stroke-width="1.5"/><line x1="188" y1="138" x2="250" y2="170" stroke="#2a78d6" stroke-width="1.5"/><text x="270" y="132" font-size="26" fill="#52514e" font-weight="400" text-anchor="start">通向 31 个输出位</text><text x="270" y="168" font-size="26" fill="#2a78d6" font-weight="700" text-anchor="start">换强后，这一支变好</text><rect x="36" y="206" width="150" height="76" rx="10" fill="#fbe3d8" stroke="#eb6834" stroke-width="2"/><text x="111" y="256" font-size="30" fill="#0b0b0b" font-weight="400" text-anchor="middle">信号 Y</text><line x1="188" y1="244" x2="250" y2="212" stroke="#eb6834" stroke-width="1.5"/><line x1="188" y1="244" x2="250" y2="228" stroke="#eb6834" stroke-width="1.5"/><line x1="188" y1="244" x2="250" y2="244" stroke="#eb6834" stroke-width="1.5"/><line x1="188" y1="244" x2="250" y2="260" stroke="#eb6834" stroke-width="1.5"/><line x1="188" y1="244" x2="250" y2="276" stroke="#eb6834" stroke-width="1.5"/><text x="270" y="238" font-size="26" fill="#52514e" font-weight="400" text-anchor="start">也有 31 个负载</text><text x="270" y="274" font-size="26" fill="#eb6834" font-weight="700" text-anchor="start">最差位置转到这一支</text><text x="36" y="350" font-size="28" fill="#0b0b0b" font-weight="400" text-anchor="start">原来那条路径的改善</text><rect x="36" y="366" width="528.3100000000001" height="56" rx="4" fill="#2a78d6"/><text x="576.3100000000001" y="406" font-size="30" fill="#0b0b0b" font-weight="700" text-anchor="start">2.30 ns</text><text x="36" y="470" font-size="28" fill="#0b0b0b" font-weight="400" text-anchor="start">全设计最差的改善</text><rect x="36" y="486" width="154.79345" height="56" rx="4" fill="#eb6834"/><text x="280" y="526" font-size="30" fill="#0b0b0b" font-weight="700" text-anchor="start">0.67 ns</text><line x1="266" y1="360" x2="266" y2="560" stroke="#0b0b0b" stroke-width="3" stroke-dasharray="9 6"/><text x="36" y="612" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="start">虚线：Claude 自己写的推翻条件——</text><text x="36" y="648" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="start">全设计最差改善不到 1 ns，假设不成立</text>
</svg>
