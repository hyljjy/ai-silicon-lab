<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="610" viewBox="0 0 1080 610" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<rect width="1080" height="610" fill="#fcfcfb"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
<marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs>
<text x="60" y="70" font-size="38" fill="#0b0b0b" font-weight="700" text-anchor="start" dominant-baseline="alphabetic">三家提出的流水切点（都还是候选）</text><rect x="60" y="260" width="140" height="90" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="130" y="316" font-size="28" fill="#0b0b0b" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">输入</text><line x1="204" y1="305" x2="264" y2="305" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="270" y="260" width="140" height="90" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="340" y="316" font-size="28" fill="#0b0b0b" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">乘法</text><line x1="414" y1="305" x2="474" y2="305" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="480" y="260" width="140" height="90" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="550" y="316" font-size="28" fill="#0b0b0b" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">相加</text><line x1="624" y1="305" x2="684" y2="305" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="690" y="260" width="140" height="90" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="760" y="316" font-size="28" fill="#0b0b0b" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">饱和</text><line x1="834" y1="305" x2="874" y2="305" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="880" y="260" width="160" height="90" rx="10" fill="#dbe8f8" stroke="#2a78d6" stroke-width="2"/><text x="960" y="316" font-size="28" fill="#0b0b0b" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">输出寄存器</text><line x1="235" y1="186" x2="235" y2="380" stroke="#eb6834" stroke-width="4" stroke-dasharray="10 7"/><text x="235" y="140" font-size="26" fill="#eb6834" font-weight="700" text-anchor="middle" dominant-baseline="alphabetic">先寄存输入</text><text x="235" y="170" font-size="22" fill="#52514e" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">两拍（L = 2）</text><line x1="445" y1="186" x2="445" y2="380" stroke="#eb6834" stroke-width="4" stroke-dasharray="10 7"/><text x="445" y="140" font-size="26" fill="#eb6834" font-weight="700" text-anchor="middle" dominant-baseline="alphabetic">乘积后寄存</text><text x="445" y="170" font-size="22" fill="#52514e" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">两拍（L = 2）</text><text x="560" y="430" font-size="26" fill="#52514e" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">也有三拍（L = 3）的备选：两处都切</text><text x="60" y="500" font-size="24" fill="#52514e" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">加一级寄存器，一笔计算分两拍完成，稳态仍每拍处理一笔。</text><text x="60" y="536" font-size="24" fill="#52514e" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">合同要求：延迟最多 3 拍，接口和输入输出约束不变，面积不超过原来的 1.25 倍。</text><text x="60" y="572" font-size="24" fill="#52514e" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">有没有效，要到阶段 B 改了 RTL、重新综合和仿真才知道。</text>
</svg>
