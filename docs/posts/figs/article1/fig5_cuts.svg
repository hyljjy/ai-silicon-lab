<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<rect width="720" height="600" fill="#fcfcfb"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="36" y="58" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">主要的流水候选</text><text x="36" y="100" font-size="26" fill="#52514e" font-weight="400" text-anchor="start">蓝框是寄存器；都要到阶段 B 才验证</text><text x="36" y="150" font-size="28" fill="#0b0b0b" font-weight="700" text-anchor="start">候选 1：先寄存输入（L = 2）</text><rect x="36" y="170" width="150" height="82" rx="10" fill="#dbe8f8" stroke="#2a78d6" stroke-width="2"/><text x="111" y="206" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">输入</text><text x="111" y="238" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">寄存</text><line x1="187" y1="211" x2="199" y2="211" stroke="#52514e" stroke-width="2"/><rect x="200" y="170" width="150" height="82" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="275" y="206" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">乘·加</text><text x="275" y="238" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">·饱和</text><line x1="351" y1="211" x2="363" y2="211" stroke="#52514e" stroke-width="2"/><rect x="364" y="170" width="150" height="82" rx="10" fill="#dbe8f8" stroke="#2a78d6" stroke-width="2"/><text x="439" y="206" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">输出</text><text x="439" y="238" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">寄存</text><text x="36" y="310" font-size="28" fill="#0b0b0b" font-weight="700" text-anchor="start">候选 2：乘积后寄存（L = 2）</text><rect x="36" y="330" width="150" height="82" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="111" y="382" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">乘法</text><line x1="187" y1="371" x2="199" y2="371" stroke="#52514e" stroke-width="2"/><rect x="200" y="330" width="150" height="82" rx="10" fill="#dbe8f8" stroke="#2a78d6" stroke-width="2"/><text x="275" y="366" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">乘积</text><text x="275" y="398" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">寄存</text><line x1="351" y1="371" x2="363" y2="371" stroke="#52514e" stroke-width="2"/><rect x="364" y="330" width="150" height="82" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="439" y="382" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">加·饱和</text><line x1="515" y1="371" x2="527" y2="371" stroke="#52514e" stroke-width="2"/><rect x="528" y="330" width="150" height="82" rx="10" fill="#dbe8f8" stroke="#2a78d6" stroke-width="2"/><text x="603" y="366" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">输出</text><text x="603" y="398" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">寄存</text><text x="36" y="470" font-size="28" fill="#0b0b0b" font-weight="700" text-anchor="start">备选：乘积后、求和后各寄存（L = 3）</text><rect x="36" y="490" width="96.33333333333333" height="82" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="84.16666666666666" y="542" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">乘法</text><line x1="133.33333333333331" y1="531" x2="145.33333333333331" y2="531" stroke="#52514e" stroke-width="2"/><rect x="146.33333333333331" y="490" width="96.33333333333333" height="82" rx="10" fill="#dbe8f8" stroke="#2a78d6" stroke-width="2"/><text x="194.49999999999997" y="526" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">乘积</text><text x="194.49999999999997" y="558" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">寄存</text><line x1="243.66666666666663" y1="531" x2="255.66666666666663" y2="531" stroke="#52514e" stroke-width="2"/><rect x="256.66666666666663" y="490" width="96.33333333333333" height="82" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="304.8333333333333" y="542" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">求和</text><line x1="353.99999999999994" y1="531" x2="365.99999999999994" y2="531" stroke="#52514e" stroke-width="2"/><rect x="366.99999999999994" y="490" width="96.33333333333333" height="82" rx="10" fill="#dbe8f8" stroke="#2a78d6" stroke-width="2"/><text x="415.16666666666663" y="526" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">和</text><text x="415.16666666666663" y="558" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">寄存</text><line x1="464.33333333333326" y1="531" x2="476.33333333333326" y2="531" stroke="#52514e" stroke-width="2"/><rect x="477.33333333333326" y="490" width="96.33333333333333" height="82" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="525.4999999999999" y="542" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">饱和</text><line x1="574.6666666666666" y1="531" x2="586.6666666666666" y2="531" stroke="#52514e" stroke-width="2"/><rect x="587.6666666666666" y="490" width="96.33333333333333" height="82" rx="10" fill="#dbe8f8" stroke="#2a78d6" stroke-width="2"/><text x="635.8333333333333" y="526" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">输出</text><text x="635.8333333333333" y="558" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">寄存</text>
</svg>
