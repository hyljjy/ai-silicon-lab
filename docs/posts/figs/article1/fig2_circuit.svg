<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<rect width="1080" height="650" fill="#fcfcfb"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
<marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs>
<text x="60" y="70" font-size="38" fill="#0b0b0b" font-weight="700" text-anchor="start" dominant-baseline="alphabetic">被测电路：四路乘加，饱和后输出</text><text x="60" y="172" font-size="26" fill="#52514e" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">a0, b0</text><line x1="150" y1="164" x2="200" y2="164" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="205" y="130" width="110" height="68" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="260" y="176" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle" dominant-baseline="alphabetic">×</text><line x1="318" y1="164" x2="395" y2="255" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><text x="60" y="262" font-size="26" fill="#52514e" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">a1, b1</text><line x1="150" y1="254" x2="200" y2="254" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="205" y="220" width="110" height="68" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="260" y="266" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle" dominant-baseline="alphabetic">×</text><line x1="318" y1="254" x2="395" y2="285" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><text x="60" y="352" font-size="26" fill="#52514e" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">a2, b2</text><line x1="150" y1="344" x2="200" y2="344" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="205" y="310" width="110" height="68" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="260" y="356" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle" dominant-baseline="alphabetic">×</text><line x1="318" y1="344" x2="395" y2="315" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><text x="60" y="442" font-size="26" fill="#52514e" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">a3, b3</text><line x1="150" y1="434" x2="200" y2="434" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="205" y="400" width="110" height="68" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="260" y="446" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle" dominant-baseline="alphabetic">×</text><line x1="318" y1="434" x2="395" y2="345" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="400" y="220" width="170" height="150" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="485" y="285" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">四个乘积</text><text x="485" y="322" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">相加（34 位）</text><line x1="572" y1="295" x2="625" y2="295" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="630" y="220" width="170" height="150" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="715" y="285" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">饱和到</text><text x="715" y="322" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">32 位</text><line x1="802" y1="295" x2="855" y2="295" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="860" y="220" width="160" height="150" rx="10" fill="#dbe8f8" stroke="#2a78d6" stroke-width="2"/><text x="940" y="285" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">输出寄存器</text><text x="940" y="322" font-size="24" fill="#52514e" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">（只有这一级）</text><line x1="200" y1="500" x2="800" y2="500" stroke="#8a8986" stroke-width="2"/><line x1="200" y1="488" x2="200" y2="512" stroke="#8a8986" stroke-width="2"/><line x1="800" y1="488" x2="800" y2="512" stroke="#8a8986" stroke-width="2"/><text x="500" y="548" font-size="28" fill="#52514e" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">全部组合逻辑挤在同一拍里（延迟 L = 1）</text><text x="715" y="410" font-size="22" fill="#eb6834" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">末端有高扇出的公共控制信号</text><text x="715" y="440" font-size="22" fill="#eb6834" font-weight="400" text-anchor="middle" dominant-baseline="alphabetic">（下文的 X、Y，各驱动 31 位）</text><text x="60" y="610" font-size="24" fill="#52514e" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">时钟周期 27.91 ns。最差路径从输入 in_b[2] 出发，经过 37 个组合单元到达输出寄存器。</text>
</svg>
