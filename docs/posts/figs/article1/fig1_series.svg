<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="900" viewBox="0 0 1080 900" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<rect width="1080" height="900" fill="#fcfcfb"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
<marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs>
<text x="60" y="80" font-size="40" fill="#0b0b0b" font-weight="700" text-anchor="start" dominant-baseline="alphabetic">这个系列怎么做</text><rect x="60" y="120" width="960" height="130" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="100" y="178" font-size="40" fill="#52514e" font-weight="700" text-anchor="start" dominant-baseline="alphabetic">①</text><text x="170" y="176" font-size="34" fill="#0b0b0b" font-weight="700" text-anchor="start" dominant-baseline="alphabetic">先定题目和规则</text><text x="170" y="222" font-size="26" fill="#52514e" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">设计、约束、综合和分析配置在 AI 介入前固定</text><line x1="540" y1="252" x2="540" y2="286" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="60" y="290" width="960" height="130" rx="10" fill="#dbe8f8" stroke="#2a78d6" stroke-width="2"/><text x="100" y="348" font-size="40" fill="#2a78d6" font-weight="700" text-anchor="start" dominant-baseline="alphabetic">②</text><text x="170" y="346" font-size="34" fill="#0b0b0b" font-weight="700" text-anchor="start" dominant-baseline="alphabetic">AI 读报告、下诊断</text><text x="170" y="392" font-size="26" fill="#52514e" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">逐条核对：对照原文，做查询和对照</text><text x="990" y="346" font-size="24" fill="#2a78d6" font-weight="400" text-anchor="end" dominant-baseline="alphabetic">本文 · CASE-01 阶段 A</text><line x1="540" y1="422" x2="540" y2="456" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="60" y="460" width="960" height="130" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="100" y="518" font-size="40" fill="#52514e" font-weight="700" text-anchor="start" dominant-baseline="alphabetic">③</text><text x="170" y="516" font-size="34" fill="#0b0b0b" font-weight="700" text-anchor="start" dominant-baseline="alphabetic">AI 改 RTL</text><text x="170" y="562" font-size="26" fill="#52514e" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">功能仿真 + 同一配置的时序复验，代价一起报</text><text x="990" y="516" font-size="24" fill="#52514e" font-weight="400" text-anchor="end" dominant-baseline="alphabetic">下一篇 · 阶段 B，最多两轮</text><line x1="540" y1="592" x2="540" y2="626" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="60" y="630" width="960" height="130" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="100" y="688" font-size="40" fill="#52514e" font-weight="700" text-anchor="start" dominant-baseline="alphabetic">④</text><text x="170" y="686" font-size="34" fill="#0b0b0b" font-weight="700" text-anchor="start" dominant-baseline="alphabetic">结果不好也发表</text><text x="170" y="732" font-size="26" fill="#52514e" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">没有收益就写失败分析，不试到成功为止</text><text x="60" y="830" font-size="24" fill="#52514e" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">第二个案例 CASE-02（计划）：同一设计故意漏掉一项输入延迟约束，</text><text x="60" y="866" font-size="24" fill="#52514e" font-weight="400" text-anchor="start" dominant-baseline="alphabetic">看 AI 能否分清“真的变快”和“约束漏了”。</text>
</svg>
