<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<rect width="720" height="580" fill="#fcfcfb"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="36" y="58" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">同样两项，AND 和 OR 结果不同</text><text x="36" y="100" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">"STA 再次因网表语法错误失败"</text><rect x="36" y="130" width="648" height="86" rx="10" fill="#dbe8f8" stroke="none" stroke-width="2"/><text x="58" y="184" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="start">第一项：STA 这一步失败</text><text x="662" y="184" font-size="28" fill="#2a78d6" font-weight="700" text-anchor="end">真</text><rect x="36" y="230" width="648" height="86" rx="10" fill="#fbe3d8" stroke="none" stroke-width="2"/><text x="58" y="284" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="start">第二项：失败原因是语法错误</text><text x="662" y="284" font-size="28" fill="#eb6834" font-weight="700" text-anchor="end">未知</text><text x="58" y="362" font-size="23" fill="#52514e" font-weight="400" text-anchor="start">字段只记成不成功，不记原因，查不了</text><rect x="36" y="400" width="312" height="150" rx="10" fill="#fbe3d8" stroke="none" stroke-width="2"/><text x="192" y="448" font-size="26" fill="#52514e" font-weight="400" text-anchor="middle">按原意转写：AND</text><text x="192" y="498" font-size="32" fill="#eb6834" font-weight="700" text-anchor="middle">未判定</text><text x="192" y="534" font-size="22" fill="#52514e" font-weight="400" text-anchor="middle">真 AND 未知 = 未知</text><rect x="372" y="400" width="312" height="150" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="528" y="448" font-size="26" fill="#52514e" font-weight="400" text-anchor="middle">假如转写成 OR</text><text x="528" y="498" font-size="32" fill="#0b0b0b" font-weight="700" text-anchor="middle">触发</text><text x="528" y="534" font-size="22" fill="#52514e" font-weight="400" text-anchor="middle">真 OR 未知 = 真</text>
</svg>
