<svg xmlns="http://www.w3.org/2000/svg" width="720" height="548" viewBox="0 0 720 548" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<rect width="720" height="548" fill="#fcfcfb"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="36" y="58" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">先看缺的是哪一边</text><text x="36" y="100" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">slack、面积这类数值预测；先看工具，再看模型</text><text x="318" y="154" font-size="24" fill="#52514e" font-weight="400" text-anchor="middle">工具出了数</text><text x="566" y="154" font-size="24" fill="#52514e" font-weight="400" text-anchor="middle">工具没出数</text><text x="36" y="252" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">模型给了</text><text x="36" y="406" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">模型没给</text><rect x="196" y="170" width="244" height="142" rx="10" fill="#dbe8f8" stroke="none" stroke-width="2"/><text x="318" y="234" font-size="28" fill="#2a78d6" font-weight="700" text-anchor="middle">支持 / 反对</text><text x="318" y="276" font-size="22" fill="#52514e" font-weight="400" text-anchor="middle">按方向和范围判</text><rect x="448" y="170" width="244" height="142" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="570" y="234" font-size="28" fill="#0b0b0b" font-weight="700" text-anchor="middle">无结果</text><text x="570" y="276" font-size="22" fill="#52514e" font-weight="400" text-anchor="middle">不判对错</text><rect x="196" y="320" width="244" height="142" rx="10" fill="#fbe3d8" stroke="none" stroke-width="2"/><text x="318" y="384" font-size="28" fill="#eb6834" font-weight="700" text-anchor="middle">未判定</text><text x="318" y="426" font-size="22" fill="#52514e" font-weight="400" text-anchor="middle">有实际值，但没可判的</text><rect x="448" y="320" width="244" height="142" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="570" y="384" font-size="28" fill="#0b0b0b" font-weight="700" text-anchor="middle">无结果</text><text x="570" y="426" font-size="22" fill="#52514e" font-weight="400" text-anchor="middle">本次也出现过</text><text x="36" y="518" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">延迟和功能直接比较；另有"不适用"。</text>
