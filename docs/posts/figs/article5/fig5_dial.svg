<svg xmlns="http://www.w3.org/2000/svg" width="720" height="648" viewBox="0 0 720 648" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<rect width="720" height="648" fill="#fcfcfb"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="36" y="58" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">线索是难度旋钮</text><text x="36" y="100" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">本题给了约束线索，只能观察有提示时的表现</text><line x1="60" y1="176" x2="660" y2="176" stroke="#c9c8c3" stroke-width="6"/><text x="60" y="220" font-size="25" fill="#52514e" font-weight="400" text-anchor="start">线索多</text><text x="660" y="220" font-size="25" fill="#52514e" font-weight="400" text-anchor="end">线索少</text><circle cx="170" cy="176" r="15" fill="#eb6834"/><text x="170" y="148" font-size="25" fill="#eb6834" font-weight="700" text-anchor="middle">这道题</text><rect x="36" y="250" width="648" height="216" rx="10" fill="#dbe8f8" stroke="none" stroke-width="2"/><text x="58" y="296" font-size="27" fill="#2a78d6" font-weight="700" text-anchor="start">测得到</text><text x="58" y="342" font-size="25" fill="#0b0b0b" font-weight="400" text-anchor="start">把 slack 变好当成电路变快了吗</text><text x="58" y="384" font-size="25" fill="#0b0b0b" font-weight="400" text-anchor="start">分清要求加什么、实际加了什么了吗</text><text x="58" y="426" font-size="25" fill="#0b0b0b" font-weight="400" text-anchor="start">结论和证据对得上吗</text><rect x="36" y="486" width="648" height="132" rx="10" fill="#fbe3d8" stroke="none" stroke-width="2"/><text x="58" y="532" font-size="27" fill="#eb6834" font-weight="700" text-anchor="start">测不到</text><text x="58" y="578" font-size="25" fill="#0b0b0b" font-weight="400" text-anchor="start">没有提示时，能不能自己想到查约束</text>
</svg>
