<svg xmlns="http://www.w3.org/2000/svg" width="720" height="612" viewBox="0 0 720 612" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<rect width="720" height="612" fill="#fcfcfb"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="36" y="58" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">两边手里的东西不一样</text><text x="36" y="100" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">同一道题，出题人和模型各看到什么</text><rect x="36" y="130" width="312" height="400" rx="10" fill="#fbe3d8" stroke="none" stroke-width="2"/><text x="192" y="180" font-size="28" fill="#eb6834" font-weight="700" text-anchor="middle">出题人</text><text x="64" y="242" font-size="25" fill="#0b0b0b" font-weight="400" text-anchor="start">两份 SDC</text><text x="64" y="298" font-size="25" fill="#0b0b0b" font-weight="400" text-anchor="start">展开后的约束</text><text x="64" y="354" font-size="25" fill="#0b0b0b" font-weight="400" text-anchor="start">128 条删除清单</text><text x="64" y="410" font-size="25" fill="#0b0b0b" font-weight="400" text-anchor="start">覆盖检查的输出</text><text x="64" y="466" font-size="25" fill="#0b0b0b" font-weight="400" text-anchor="start">R1、R2 对应另行封存</text><rect x="372" y="130" width="312" height="400" rx="10" fill="#dbe8f8" stroke="none" stroke-width="2"/><text x="528" y="180" font-size="28" fill="#2a78d6" font-weight="700" text-anchor="middle">模型</text><text x="400" y="242" font-size="25" fill="#0b0b0b" font-weight="400" text-anchor="start">接口要求</text><text x="400" y="298" font-size="25" fill="#0b0b0b" font-weight="400" text-anchor="start">两份摘要</text><text x="400" y="354" font-size="25" fill="#0b0b0b" font-weight="400" text-anchor="start">两份路径报告</text><text x="400" y="410" font-size="25" fill="#0b0b0b" font-weight="400" text-anchor="start">RTL</text><text x="400" y="466" font-size="25" fill="#0b0b0b" font-weight="400" text-anchor="start">背景说明</text><text x="36" y="582" font-size="26" fill="#52514e" font-weight="400" text-anchor="start">第 1 轮不提供任何 SDC，也不告知是否有 bug。</text>
</svg>
