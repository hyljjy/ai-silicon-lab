<svg xmlns="http://www.w3.org/2000/svg" width="720" height="694" viewBox="0 0 720 694" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<rect width="720" height="694" fill="#fcfcfb"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="36" y="58" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">删哪里，决定最差 setup 值动不动</text><text x="36" y="100" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">基线六个角的最差起点都在 in_b</text><rect x="36" y="130" width="648" height="150" rx="10" fill="#dbe8f8" stroke="none" stroke-width="2"/><text x="58" y="180" font-size="28" fill="#0b0b0b" font-weight="700" text-anchor="start">删 in_b（64 位）</text><text x="58" y="222" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">最差 −4.189726 → −4.172595 ns</text><text x="58" y="258" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">起点 in_b[2] → in_a[34]（ss_n40C_1v60）</text><text x="662" y="180" font-size="26" fill="#2a78d6" font-weight="700" text-anchor="end">实测</text><rect x="36" y="298" width="648" height="150" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="58" y="348" font-size="28" fill="#0b0b0b" font-weight="700" text-anchor="start">删 in_a（同样 64 位）</text><text x="58" y="390" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">最差路径还在</text><text x="58" y="426" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">最差 setup 值预计不变</text><text x="662" y="348" font-size="26" fill="#52514e" font-weight="700" text-anchor="end">推断</text><rect x="36" y="466" width="648" height="150" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="58" y="516" font-size="28" fill="#0b0b0b" font-weight="700" text-anchor="start">删 in_valid（1 位）</text><text x="58" y="558" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">不在最差路径的起点上</text><text x="58" y="594" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">最差 setup 值预计不变</text><text x="662" y="516" font-size="26" fill="#52514e" font-weight="700" text-anchor="end">推断</text><text x="36" y="664" font-size="26" fill="#52514e" font-weight="400" text-anchor="start">关键不是删得多，是删到最差路径的起点。</text>
</svg>
