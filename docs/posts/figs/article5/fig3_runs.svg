<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<rect width="720" height="760" fill="#fcfcfb"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="36" y="58" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">三个版本，比三次</text><text x="36" y="100" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">比的是展开约束和全部记录文件</text><rect x="230" y="130" width="260" height="76" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="360" y="178" font-size="28" fill="#0b0b0b" font-weight="700" text-anchor="middle">F1 归档</text><line x1="360" y1="206" x2="360" y2="306" stroke="#52514e" stroke-width="3"/><text x="382" y="248" font-size="26" fill="#2a78d6" font-weight="700" text-anchor="start">全部一致</text><text x="382" y="284" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">golden 没变</text><rect x="230" y="306" width="260" height="76" rx="10" fill="#dbe8f8" stroke="none" stroke-width="2"/><text x="360" y="354" font-size="28" fill="#2a78d6" font-weight="700" text-anchor="middle">正确版</text><line x1="290" y1="382" x2="170" y2="510" stroke="#52514e" stroke-width="3"/><line x1="430" y1="382" x2="550" y2="510" stroke="#52514e" stroke-width="3"/><rect x="50" y="510" width="260" height="76" rx="10" fill="#fbe3d8" stroke="none" stroke-width="2"/><text x="180" y="558" font-size="28" fill="#eb6834" font-weight="700" text-anchor="middle">缺失版</text><rect x="410" y="510" width="260" height="76" rx="10" fill="#dbe8f8" stroke="none" stroke-width="2"/><text x="540" y="558" font-size="28" fill="#2a78d6" font-weight="700" text-anchor="middle">恢复版</text><text x="180" y="628" font-size="26" fill="#eb6834" font-weight="700" text-anchor="middle">数值和路径报告 24 项</text><text x="180" y="664" font-size="24" fill="#52514e" font-weight="400" text-anchor="middle">差别只在预期处</text><text x="540" y="628" font-size="26" fill="#2a78d6" font-weight="700" text-anchor="middle">逐字节相同</text><text x="540" y="664" font-size="24" fill="#52514e" font-weight="400" text-anchor="middle">同样的输入能重现</text><text x="36" y="730" font-size="26" fill="#52514e" font-weight="400" text-anchor="start">恢复版就是用原始 SDC 再跑一遍，不发给模型。</text>
</svg>
