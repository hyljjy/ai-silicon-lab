<svg xmlns="http://www.w3.org/2000/svg" width="720" height="898" viewBox="0 0 720 898" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<rect width="720" height="898" fill="#fcfcfb"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="36" y="58" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">怎么考</text><text x="36" y="100" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">三家拿同一份材料，走同一套公开规则</text><rect x="36" y="130" width="648" height="96" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="56" y="172" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="start">材料：意图、摘要、路径报告、RTL、背景说明</text><text x="56" y="208" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">没有约束脚本，也没说脚本改过</text><line x1="360" y1="228" x2="360" y2="248" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="36" y="252" width="648" height="66" rx="10" fill="#dbe8f8" stroke="none" stroke-width="2"/><text x="56" y="294" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="start">第 1 轮：写初判，点名要查什么</text><line x1="360" y1="320" x2="360" y2="340" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="36" y="344" width="648" height="96" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="56" y="386" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="start">执行器按公开规则跑查询</text><text x="56" y="422" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">只取答复前 120 行；每条 ≤ 2000 行、≤ 600 秒</text><line x1="360" y1="442" x2="360" y2="462" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="36" y="466" width="648" height="96" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="56" y="508" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="start">查询结果交还给模型</text><text x="56" y="544" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">模型只拿到自己点名要的</text><line x1="360" y1="564" x2="360" y2="584" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="36" y="588" width="648" height="66" rx="10" fill="#dbe8f8" stroke="none" stroke-width="2"/><text x="56" y="630" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="start">第 2 轮：拿着结果写复判</text><line x1="360" y1="656" x2="360" y2="676" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="36" y="680" width="648" height="96" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="56" y="722" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="start">评分：三个问题</text><text x="56" y="758" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">当没当成变快？分没分清要求和实际？话说到哪一步？</text><line x1="360" y1="778" x2="360" y2="798" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="36" y="802" width="648" height="66" rx="10" fill="#fbe3d8" stroke="none" stroke-width="2"/><text x="56" y="844" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="start">揭盲：R1 是缺失版，代号对应到模型</text>
</svg>
