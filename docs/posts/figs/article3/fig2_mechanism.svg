<svg xmlns="http://www.w3.org/2000/svg" width="720" height="842" viewBox="0 0 720 842" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<rect width="720" height="842" fill="#fcfcfb"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="36" y="58" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">最差值只在“受约束”的路径里挑</text><text x="36" y="100" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">缺失版：in_b 没有时钟参考，被分到另一组</text><rect x="36" y="150" width="230" height="64" rx="10" fill="#dbe8f8" stroke="none" stroke-width="2"/><text x="52" y="191" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="Consolas,Menlo,'Courier New',monospace">in_a[63:0]</text><text x="254" y="191" font-size="22" fill="#52514e" font-weight="400" text-anchor="end">64 位</text><line x1="268" y1="182" x2="398" y2="200" stroke="#2a78d6" stroke-width="2" marker-end="url(#arr)"/><rect x="36" y="230" width="230" height="64" rx="10" fill="#dbe8f8" stroke="none" stroke-width="2"/><text x="52" y="271" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="Consolas,Menlo,'Courier New',monospace">in_valid</text><text x="254" y="271" font-size="22" fill="#52514e" font-weight="400" text-anchor="end">1 位</text><line x1="268" y1="262" x2="398" y2="240" stroke="#2a78d6" stroke-width="2" marker-end="url(#arr)"/><rect x="36" y="310" width="230" height="64" rx="10" fill="#dbe8f8" stroke="none" stroke-width="2"/><text x="52" y="351" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="Consolas,Menlo,'Courier New',monospace">rst</text><text x="254" y="351" font-size="22" fill="#52514e" font-weight="400" text-anchor="end">1 位</text><line x1="268" y1="342" x2="398" y2="280" stroke="#2a78d6" stroke-width="2" marker-end="url(#arr)"/><rect x="36" y="450" width="230" height="64" rx="10" fill="#fbe3d8" stroke="none" stroke-width="2"/><text x="52" y="491" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="Consolas,Menlo,'Courier New',monospace">in_b[63:0]</text><text x="254" y="491" font-size="22" fill="#52514e" font-weight="400" text-anchor="end">64 位</text><line x1="268" y1="482" x2="398" y2="482" stroke="#eb6834" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arr)"/><rect x="404" y="160" width="280" height="180" rx="10" fill="#dbe8f8" stroke="#2a78d6" stroke-width="2"/><text x="544" y="221" font-size="26" fill="#2a78d6" font-weight="700" text-anchor="middle">受约束的检查</text><text x="544" y="259" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">66 个输入</text><text x="544" y="297" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">参加最差 slack 统计</text><rect x="404" y="410" width="280" height="140" rx="10" fill="#ffffff" stroke="#eb6834" stroke-width="2" stroke-dasharray="8 6"/><text x="544" y="451" font-size="26" fill="#eb6834" font-weight="700" text-anchor="middle">未约束</text><text x="544" y="489" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">路径还在</text><text x="544" y="527" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">不进最差 slack</text><text x="36" y="630" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="start">正确版：130 个输入都在上面那一组，</text><text x="36" y="670" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="start">最差的那条恰好从 in_b 出发。</text><text x="36" y="726" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="start">缺失版：in_b 整组被挪走，</text><text x="36" y="766" font-size="26" fill="#eb6834" font-weight="700" text-anchor="start">最差值只能从剩下的 66 个里挑。</text><text x="36" y="812" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">示意图；这是本例 OpenSTA 设置下的行为</text>
</svg>
