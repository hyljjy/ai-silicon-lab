<svg xmlns="http://www.w3.org/2000/svg" width="720" height="822" viewBox="0 0 720 822" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<rect width="720" height="822" fill="#fcfcfb"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="36" y="58" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">第 2 轮：证据走到哪一层</text><text x="36" y="100" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">实心：作者揭盲前接受的口径；空心：预登记的字面</text><line x1="250" y1="186" x2="600" y2="186" stroke="#c9c8c3" stroke-width="4"/><line x1="250" y1="176" x2="250" y2="196" stroke="#c9c8c3" stroke-width="4"/><text x="250" y="160" font-size="24" fill="#52514e" font-weight="700" text-anchor="middle">线索</text><line x1="420" y1="176" x2="420" y2="196" stroke="#c9c8c3" stroke-width="4"/><text x="420" y="160" font-size="24" fill="#52514e" font-weight="700" text-anchor="middle">现象级</text><line x1="600" y1="176" x2="600" y2="196" stroke="#c9c8c3" stroke-width="4"/><text x="600" y="160" font-size="24" fill="#52514e" font-weight="700" text-anchor="middle">目标集合完整</text><text x="36" y="270" font-size="28" fill="#0b0b0b" font-weight="700" text-anchor="start">Claude</text><line x1="250" y1="260" x2="600" y2="260" stroke="#e4e3df" stroke-width="2"/><circle cx="600" cy="260" r="15" fill="#2a78d6"/><text x="36" y="312" font-size="22" fill="#2a78d6" font-weight="400" text-anchor="start">判定：完成本次诊断</text><text x="684" y="312" font-size="22" fill="#eb6834" font-weight="400" text-anchor="end">另记：范围超出证据</text><text x="36" y="346" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">两种口径相同</text><text x="36" y="416" font-size="28" fill="#0b0b0b" font-weight="700" text-anchor="start">Kimi</text><line x1="250" y1="406" x2="600" y2="406" stroke="#e4e3df" stroke-width="2"/><circle cx="420" cy="406" r="13" fill="#ffffff" stroke="#52514e" stroke-width="3"/><line x1="436" y1="406" x2="580" y2="406" stroke="#52514e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><circle cx="600" cy="406" r="15" fill="#2a78d6"/><text x="36" y="458" font-size="22" fill="#2a78d6" font-weight="400" text-anchor="start">判定：完成本次诊断（作者裁定）</text><text x="684" y="458" font-size="22" fill="#eb6834" font-weight="400" text-anchor="end">另记：范围超出证据</text><text x="36" y="492" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">字面：现象级，结论的确定程度高于证据</text><text x="36" y="562" font-size="28" fill="#0b0b0b" font-weight="700" text-anchor="start">DeepSeek</text><line x1="250" y1="552" x2="600" y2="552" stroke="#e4e3df" stroke-width="2"/><circle cx="250" cy="552" r="13" fill="#ffffff" stroke="#52514e" stroke-width="3"/><line x1="266" y1="552" x2="400" y2="552" stroke="#52514e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><circle cx="420" cy="552" r="15" fill="#2a78d6"/><text x="36" y="604" font-size="22" fill="#2a78d6" font-weight="400" text-anchor="start">判定：完成现象级诊断（作者裁定）</text><text x="36" y="638" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">字面：只有线索，判断合理</text><rect x="36" y="678" width="648" height="70" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="56" y="722" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start">第 1 轮：三家都停在“合理假设”</text><text x="36" y="794" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">结论只覆盖各自查过的角，不是六个角全部核验</text>
</svg>
