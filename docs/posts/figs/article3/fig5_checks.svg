<svg xmlns="http://www.w3.org/2000/svg" width="720" height="914" viewBox="0 0 720 914" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<rect width="720" height="914" fill="#fcfcfb"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="36" y="58" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">哪些检查看得出来</text><text x="36" y="100" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">缺失版上的输出</text><rect x="36" y="130" width="648" height="96" rx="10" fill="#dbe8f8" stroke="none" stroke-width="2"/><text x="56" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start" font-family="Consolas,Menlo,'Courier New',monospace">check_setup -verbose</text><text x="56" y="206" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">列出 64 个缺 input delay 的端口名</text><text x="664" y="206" font-size="24" fill="#2a78d6" font-weight="700" text-anchor="end">给出名单</text><rect x="36" y="242" width="648" height="96" rx="10" fill="#dbe8f8" stroke="none" stroke-width="2"/><text x="56" y="280" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start" font-family="Consolas,Menlo,'Courier New',monospace">逐端口 min/max 计数</text><text x="56" y="318" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">ss 角：64 个端口受约束的 min、max 都是 0</text><text x="664" y="318" font-size="24" fill="#2a78d6" font-weight="700" text-anchor="end">看出缺口</text><rect x="36" y="354" width="648" height="96" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="56" y="392" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start" font-family="Consolas,Menlo,'Courier New',monospace">report_checks -from in_b[*]</text><text x="56" y="430" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">六个角都是 No paths found.</text><text x="664" y="430" font-size="24" fill="#52514e" font-weight="700" text-anchor="end">只见现象</text><rect x="36" y="466" width="648" height="96" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="56" y="504" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start" font-family="Consolas,Menlo,'Courier New',monospace">同上加 -unconstrained</text><text x="56" y="542" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">每个角一条未约束路径</text><text x="664" y="542" font-size="24" fill="#52514e" font-weight="700" text-anchor="end">只见现象</text><rect x="36" y="578" width="648" height="96" rx="10" fill="#fbe3d8" stroke="none" stroke-width="2"/><text x="56" y="616" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start" font-family="Consolas,Menlo,'Courier New',monospace">check_setup -unconstrained_endpoints</text><text x="56" y="654" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">无输出</text><text x="664" y="654" font-size="24" fill="#eb6834" font-weight="700" text-anchor="end">看不出</text><rect x="36" y="690" width="648" height="96" rx="10" fill="#fbe3d8" stroke="none" stroke-width="2"/><text x="56" y="728" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start" font-family="Consolas,Menlo,'Courier New',monospace">全局最小 hold slack</text><text x="56" y="766" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">两版一模一样（摘要里就有）</text><text x="664" y="766" font-size="24" fill="#eb6834" font-weight="700" text-anchor="end">看不出</text><text x="36" y="822" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">覆盖检查是操作者预先跑的，没放进给模型的材料；</text><text x="36" y="854" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">hold 最小值在两次运行的摘要里就有。</text><text x="36" y="886" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">要确认缺的是什么，得名单加逐端口状态一起看。</text>
</svg>
