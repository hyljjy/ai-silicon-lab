<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="36" y="58" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">同一张网表，跑两次 STA</text><text x="36" y="100" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">只改约束，网表一个门都没动</text><rect x="160" y="130" width="400" height="70" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="360" y="174" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="middle">综合后网表（同一张）</text><line x1="300" y1="202" x2="200" y2="250" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><line x1="420" y1="202" x2="520" y2="250" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="36" y="256" width="312" height="150" rx="10" fill="#dbe8f8" stroke="none" stroke-width="2"/><text x="192" y="302" font-size="26" fill="#2a78d6" font-weight="700" text-anchor="middle">正确版</text><text x="192" y="340" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">130 个输入</text><text x="192" y="378" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">都有 set_input_delay</text><rect x="372" y="256" width="312" height="150" rx="10" fill="#fbe3d8" stroke="none" stroke-width="2"/><text x="528" y="302" font-size="26" fill="#eb6834" font-weight="700" text-anchor="middle">缺失版</text><text x="528" y="340" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">删掉 in_b[63:0] 的</text><text x="528" y="378" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">min、max，共 128 条</text><line x1="192" y1="408" x2="192" y2="446" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><line x1="528" y1="408" x2="528" y2="446" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="36" y="452" width="312" height="130" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="192" y="488" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">最差 setup slack</text><text x="192" y="526" font-size="30" fill="#0b0b0b" font-weight="700" text-anchor="middle">−4.189726 ns</text><text x="192" y="564" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace">起点 in_b[2]</text><rect x="372" y="452" width="312" height="130" rx="10" fill="#ffffff" stroke="#eb6834" stroke-width="2"/><text x="528" y="488" font-size="26" fill="#0b0b0b" font-weight="400" text-anchor="middle">最差 setup slack</text><text x="528" y="526" font-size="30" fill="#0b0b0b" font-weight="700" text-anchor="middle">−4.172595 ns</text><text x="528" y="564" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace">起点 in_a[34]</text><text x="360" y="636" font-size="28" fill="#eb6834" font-weight="700" text-anchor="middle">缺失版“好了”0.017 ns，起点也换了</text><text x="360" y="676" font-size="22" fill="#52514e" font-weight="400" text-anchor="middle">输入到寄存器；ss，1.60 V，−40 °C</text><text x="360" y="706" font-size="22" fill="#52514e" font-weight="400" text-anchor="middle">综合后、理想时钟、不读寄生、只计引脚电容</text>
