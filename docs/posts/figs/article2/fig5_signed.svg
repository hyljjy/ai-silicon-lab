<text x="36" y="58" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">五份候选卡在哪</text><text x="36" y="100" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">本次冻结流程中：仿真器读得进，OpenSTA 读不进</text><rect x="36" y="130" width="648" height="110" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="60" y="170" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">候选 RTL 里的写法（合同允许）</text><text x="60" y="214" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="Consolas,Menlo,'Courier New',monospace">wire signed [15:0] a0 = a_q[15:0];</text><line x1="360" y1="244" x2="360" y2="290" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><text x="380" y="274" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">冻结的综合配方写出网表</text><rect x="36" y="296" width="648" height="110" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="60" y="336" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">综合网表里保留了 signed</text><text x="60" y="380" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="Consolas,Menlo,'Courier New',monospace">wire signed [15:0] a0;</text><line x1="200" y1="410" x2="200" y2="452" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><line x1="520" y1="410" x2="520" y2="452" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="36" y="458" width="312" height="130" rx="10" fill="#dbe8f8" stroke="#2a78d6" stroke-width="2"/><text x="192" y="500" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="middle">门级仿真（iverilog）</text><text x="192" y="540" font-size="26" fill="#2a78d6" font-weight="700" text-anchor="middle">读得进</text><text x="192" y="574" font-size="22" fill="#52514e" font-weight="400" text-anchor="middle">功能回归通过</text><rect x="372" y="458" width="312" height="130" rx="10" fill="#fbe3d8" stroke="#eb6834" stroke-width="2"/><text x="528" y="500" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="middle">STA（OpenSTA）</text><text x="528" y="540" font-size="26" fill="#eb6834" font-weight="700" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace">syntax error</text><text x="528" y="574" font-size="22" fill="#52514e" font-weight="400" text-anchor="middle">没有任何时序数字</text><text x="36" y="646" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="start">网表里 wire signed 声明的个数（基线为 0）</text><text x="60" y="708" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="start"></text><text x="400" y="708" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="middle">第 1 轮</text><text x="580" y="708" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="middle">第 2 轮</text><line x1="36" y1="724" x2="684" y2="724" stroke="#e4e3df" stroke-width="1.5"/><text x="60" y="760" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start">Claude</text><text x="400" y="760" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="middle">16</text><text x="580" y="760" font-size="24" fill="#2a78d6" font-weight="700" text-anchor="middle">0</text><line x1="36" y1="776" x2="684" y2="776" stroke="#e4e3df" stroke-width="1.5"/><text x="60" y="812" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start">Kimi</text><text x="400" y="812" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="middle">8</text><text x="580" y="812" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="middle">8</text><line x1="36" y1="828" x2="684" y2="828" stroke="#e4e3df" stroke-width="1.5"/><text x="60" y="864" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start">DeepSeek</text><text x="400" y="864" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="middle">8</text><text x="580" y="864" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="middle">8</text><text x="36" y="910" font-size="22" fill="#2a78d6" font-weight="400" text-anchor="start">第 2 轮只有 Claude 的网表里没有 signed 声明，S