ze="30" fill="#52514e" font-weight="700" text-anchor="end">6 / 6</text><line x1="360" y1="606" x2="360" y2="626" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="36" y="630" width="648" height="74" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="60" y="677" font-size="28" fill="#0b0b0b" font-weight="400" text-anchor="start">⑤ 门级功能仿真</text><text x="660" y="677" font-size="30" fill="#52514e" font-weight="700" text-anchor="end">6 / 6</text><line x1="360" y1="706" x2="360" y2="726" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="36" y="730" width="648" height="74" rx="10" fill="#fbe3d8" stroke="#eb6834" stroke-width="2"/><text x="60" y="777" font-size="28" fill="#0b0b0b" font-weight="700" text-anchor="start">⑥ STA，6 个角</text><text x="660" y="777" font-size="30" fill="#eb6834" font-weight="700" text-anchor="end">1 / 6</text><line x1="360" y1="806" x2="360" y2="826" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="36" y="830" width="648" height="74" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="60" y="877" font-size="28" fill="#0b0b0b" font-weight="400" text-anchor="start">⑦ 分析有效性检查</text><text x="660" y="877" font-size="30" fill="#52514e" font-weight="700" text-anchor="end">1 / 6</text><line x1="360" y1="906" x2="360" y2="926" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="36" y="930" width="648" height="74" rx="10" fill="#dbe8f8" stroke="none" stroke-width="2"/><text x="60" y="977" font-size="28" fill="#0b0b0b" font-weight="700" text-anchor="start">⑧ 和基线对照：完整时序矩阵</text><text x="660" y="977" font-size="30" fill="#52514e" font-weight="700" text-anchor="end">1 / 6</text><text x="36" y="1044" font-size="26" fill="#eb6834" font-weight="700" text-anchor="start">5 份卡在 ⑥：OpenSTA 读不进综合网表</text><rect x="36" y="1074" width="648" height="112" rx="10" fill="none" stroke="#2a78d6" stroke-width="2" stroke-dasharray="8 6"/><text x="60" y="1118" font-size="28" fill="#2a78d6" font-weight="700" text-anchor="start">预测和失败条件：6 份都判</text><text x="60" y="1160" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">按已有字段判；缺时序结果的记“无结果”或“未判定”</text>
