<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<rect width="720" height="680" fill="#fcfcfb"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="36" y="58" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">插流水以后，路径预算怎么变</text><text x="36" y="100" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">示意图，不按比例；输入输出约束都没变</text><text x="36" y="160" font-size="28" fill="#52514e" font-weight="700" text-anchor="start">基线（L = 1）</text><text x="36" y="224" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">唯一一拍</text><rect x="170" y="180" width="98" height="66" rx="4" fill="#8a8986" stroke="none" stroke-width="2"/><text x="219" y="222" font-size="19" fill="#ffffff" font-weight="400" text-anchor="middle">外部 0.2T</text><rect x="272" y="180" width="404" height="66" rx="4" fill="#eb6834" stroke="none" stroke-width="2"/><text x="474" y="222" font-size="22" fill="#ffffff" font-weight="400" text-anchor="middle">输入 → 输出寄存器：全部运算</text><text x="36" y="330" font-size="28" fill="#2a78d6" font-weight="700" text-anchor="start">Claude 第 2 轮（L = 3）</text><text x="36" y="394" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">第 1 拍</text><rect x="170" y="350" width="98" height="66" rx="4" fill="#8a8986" stroke="none" stroke-width="2"/><text x="219" y="392" font-size="19" fill="#ffffff" font-weight="400" text-anchor="middle">外部 0.2T</text><rect x="272" y="350" width="404" height="66" rx="4" fill="#2a78d6" stroke="none" stroke-width="2"/><text x="474" y="392" font-size="22" fill="#ffffff" font-weight="400" text-anchor="middle">输入 → 输入寄存器</text><text x="36" y="480" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">第 2 拍</text><rect x="170" y="436" width="506" height="66" rx="4" fill="#2a78d6" stroke="none" stroke-width="2"/><text x="423" y="478" font-size="22" fill="#ffffff" font-weight="400" text-anchor="middle">寄存器 → 寄存器：用整个周期</text><text x="36" y="566" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">第 3 拍</text><rect x="170" y="522" width="506" height="66" rx="4" fill="#2a78d6" stroke="none" stroke-width="2"/><text x="423" y="564" font-size="22" fill="#ffffff" font-weight="400" text-anchor="middle">寄存器 → 输出寄存器：用整个周期</text><line x1="170" y1="614" x2="676" y2="614" stroke="#c9c8c3" stroke-width="2"/><line x1="170" y1="606" x2="170" y2="622" stroke="#c9c8c3" stroke-width="2"/><line x1="676" y1="606" x2="676" y2="622" stroke="#c9c8c3" stroke-width="2"/><text x="425" y="650" font-size="22" fill="#8a8986" font-weight="400" text-anchor="middle">一个时钟周期 T = 27.91 ns</text>
</svg>
