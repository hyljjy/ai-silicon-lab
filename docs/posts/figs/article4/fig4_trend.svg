<text x="36" y="58" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">三对角的低温 slack 损失不同</text><text x="36" y="100" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">低温比高温的最差 setup slack 差多少</text><text x="36" y="180" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">ss，1.60 V</text><text x="36" y="214" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">−40 / 100 °C</text><rect x="230" y="158" width="291.8706666666667" height="40" rx="3" fill="#eb6834"/><text x="533.8706666666667" y="188" font-size="26" fill="#eb6834" font-weight="700" text-anchor="start">3.502 ns</text><text x="36" y="290" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">tt，1.80 V</text><text x="36" y="324" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">25 / 100 °C</text><rect x="230" y="268" width="10.98033333333322" height="40" rx="3" fill="#eb6834"/><text x="252.98033333333322" y="298" font-size="26" fill="#eb6834" font-weight="700" text-anchor="start">0.132 ns</text><text x="36" y="400" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">ff，1.95 V</text><text x="36" y="434" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">−40 / 100 °C</text><rect x="230" y="378" width="3" height="40" rx="3" fill="#eb6834"/><text x="245" y="408" font-size="26" fill="#eb6834" font-weight="700" text-anchor="start">0.023 ns</text><line x1="230" y1="146" x2="230" y2="460" stroke="#52514e" stroke-width="2"/><text x="36" y="510" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">tt 这一对只差 75 °C，另两对差 140 °C；</text><text x="36" y="546" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">三对之间工艺也不同，不能单独归因于电压。</text><text x="36" y="592" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">CASE-01 网表，Sky130 HD；T = 27.91 ns；输出负载 0.0024 pF</text><text x="36" y="624" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">综合后、