<svg xmlns="http://www.w3.org/2000/svg" width="720" height="616" viewBox="0 0 720 616" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<rect width="720" height="616" fill="#fcfcfb"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="36" y="58" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">hold 要求从哪来：把触发器想成一扇门</text><text x="36" y="100" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">示意图</text><text x="36" y="160" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">时钟沿到达</text><line x1="190" y1="152" x2="300" y2="152" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="304" y="120" width="220" height="64" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="414" y="161" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="middle">内部时钟路径</text><line x1="526" y1="152" x2="600" y2="152" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="604" y="120" width="80" height="64" rx="10" fill="#dbe8f8" stroke="none" stroke-width="2"/><text x="644" y="161" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="middle">关门</text><text x="36" y="270" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">新数据到 D</text><line x1="190" y1="262" x2="300" y2="262" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="304" y="230" width="220" height="64" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="414" y="271" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="middle">内部数据路径</text><line x1="526" y1="262" x2="600" y2="262" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="604" y="230" width="80" height="64" rx="10" fill="#fbe3d8" stroke="none" stroke-width="2"/><text x="644" y="271" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="middle">门口</text><rect x="36" y="340" width="648" height="110" rx="10" fill="#ffffff" stroke="#52514e" stroke-width="2"/><text x="360" y="384" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="middle">hold 要求 ≈ 关门用时 − 数据走到门口用时</text><text x="360" y="424" font-size="24" fill="#52514e" font-weight="400" text-anchor="middle">数据走得比关门还慢，要求就是负的</text><text x="36" y="500" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start">两段都随温度变，但变的幅度不一样，</text><text x="36" y="538" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start">差值往哪边移都有可能，不跟着“哪个角更快”走。</text><text x="36" y="586" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">触发器内部结构在本文环境里看不到，按通用原理画</text>
</svg>
