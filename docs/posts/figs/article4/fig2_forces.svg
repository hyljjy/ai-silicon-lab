<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<rect width="720" height="760" fill="#fcfcfb"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="36" y="58" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">降温时，两股力量方向相反</text><text x="36" y="100" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">示意图</text><rect x="220" y="130" width="280" height="70" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="360" y="174" font-size="28" fill="#0b0b0b" font-weight="700" text-anchor="middle">温度降低</text><line x1="300" y1="202" x2="190" y2="262" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><line x1="420" y1="202" x2="530" y2="262" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="36" y="268" width="312" height="200" rx="10" fill="#dbe8f8" stroke="none" stroke-width="2"/><text x="192" y="323" font-size="28" fill="#2a78d6" font-weight="700" text-anchor="middle">路更好走</text><text x="192" y="359" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="middle">迁移率变大</text><text x="192" y="395" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="middle">电流变大</text><text x="192" y="431" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="middle">单元更快</text><rect x="372" y="268" width="312" height="200" rx="10" fill="#fbe3d8" stroke="none" stroke-width="2"/><text x="528" y="323" font-size="28" fill="#eb6834" font-weight="700" text-anchor="middle">门槛更高</text><text x="528" y="359" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="middle">Vth 升高，余量变小</text><text x="528" y="395" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="middle">电流变小</text><text x="528" y="431" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="middle">单元更慢</text><line x1="192" y1="470" x2="192" y2="520" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><line x1="528" y1="470" x2="528" y2="520" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="36" y="526" width="648" height="120" rx="10" fill="#ffffff" stroke="#52514e" stroke-width="2"/><text x="360" y="577" font-size="28" fill="#0b0b0b" font-weight="700" text-anchor="middle">谁赢，看余量本来有多大</text><text x="360" y="613" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="middle">余量 = 栅压 − 门槛（Vth）</text><text x="36" y="692" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start">余量小：门槛一边可能占优，低温更慢</text><text x="36" y="730" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start">余量大：迁移率一边可能占优，高温更慢</text>
</svg>
