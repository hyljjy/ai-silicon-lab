<svg xmlns="http://www.w3.org/2000/svg" width="720" height="808" viewBox="0 0 720 808" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<rect width="720" height="808" fill="#fcfcfb"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="36" y="58" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">最差 hold：被触发器自己的要求抢走</text><text x="36" y="100" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">ff，1.95 V；起点是输入端口 rst</text><rect x="36" y="130" width="150" height="64" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="111" y="171" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace">rst 端口</text><line x1="188" y1="162" x2="266" y2="162" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="270" y="130" width="170" height="64" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="355" y="171" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="middle">nor2b 门</text><line x1="442" y1="162" x2="520" y2="162" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="524" y="130" width="160" height="64" rx="10" fill="#dbe8f8" stroke="none" stroke-width="2"/><text x="604" y="171" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="middle">寄存器 D</text><text x="56" y="262" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="start"></text><text x="470" y="262" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="end">−40 °C</text><text x="660" y="262" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="end">100 °C</text><rect x="36" y="280" width="648" height="44" rx="4" fill="#efeeea" stroke="none" stroke-width="2"/><text x="56" y="310" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start">数据到达时间</text><text x="470" y="310" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="end" font-family="Consolas,Menlo,'Courier New',monospace">0.0266</text><text x="660" y="310" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="end" font-family="Consolas,Menlo,'Courier New',monospace">0.0310</text><text x="56" y="358" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start">库的 hold 要求</text><text x="470" y="358" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="end" font-family="Consolas,Menlo,'Courier New',monospace">−0.0369</text><text x="660" y="358" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="end" font-family="Consolas,Menlo,'Courier New',monospace">−0.0281</text><rect x="36" y="376" width="648" height="44" rx="4" fill="#efeeea" stroke="none" stroke-width="2"/><text x="56" y="406" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start">hold slack</text><text x="470" y="406" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="end" font-family="Consolas,Menlo,'Courier New',monospace">0.0635</text><text x="660" y="406" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="end" font-family="Consolas,Menlo,'Courier New',monospace">0.0591</text><text x="36" y="478" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">从 −40 °C 到 100 °C（单位 ps）：</text><text x="56" y="538" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start">数据更慢了（有利）</text><rect x="380" y="516" width="105.02400000000003" height="30" rx="3" fill="#2a78d6"/><text x="495.024" y="540" font-size="22" fill="#2a78d6" font-weight="700" text-anchor="start" font-family="Consolas,Menlo,'Courier New',monospace">+4.376</text><text x="56" y="588" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start">hold 要求涨了（不利）</text><rect x="380" y="566" width="209.64" height="30" rx="3" fill="#eb6834"/><text x="599.64" y="590" font-size="22" fill="#eb6834" font-weight="700" text-anchor="start" font-family="Consolas,Menlo,'Courier New',monospace">+8.735</text><text x="56" y="638" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start">slack 净变化</text><rect x="380" y="616" width="104.61599999999996" height="30" rx="3" fill="#52514e"/><text x="494.616" y="640" font-size="22" fill="#52514e" font-weight="700" text-anchor="start" font-family="Consolas,Menlo,'Courier New',monospace">−4.359</text><text x="36" y="684" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">hold slack = 到达时间 − hold 要求；表中单位 ns</text><text x="36" y="716" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">到达时间含输入端口驱动模型那一段；图中只画网表内部</text><text x="36" y="748" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">变化量由报告里已舍入的分项算出，末位可能差 1</text><text x="36" y="780" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">综合后、理想时钟、不读寄生、只计引脚电容</text>
</svg>
