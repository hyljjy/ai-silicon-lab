<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<rect width="720" height="640" fill="#fcfcfb"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="36" y="58" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">同样升高一截门槛，占比不一样</text><text x="36" y="100" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">示意图，不按比例，不是 Sky130 的数值</text><text x="36" y="194" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">低电压</text><rect x="140" y="160" width="195" height="48" rx="4" fill="#c9c8c3"/><rect x="335" y="160" width="52" height="48" fill="#eb6834"/><rect x="387" y="160" width="91.00000000000001" height="48" rx="4" fill="#2a78d6"/><text x="237.5" y="193" font-size="22" fill="#0b0b0b" font-weight="400" text-anchor="middle">门槛</text><text x="432.5" y="193" font-size="22" fill="#ffffff" font-weight="400" text-anchor="middle">余量</text><text x="36" y="252" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">橙色那一截，吃掉了余量的一大块</text><text x="36" y="354" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">高电压</text><rect x="140" y="320" width="195" height="48" rx="4" fill="#c9c8c3"/><rect x="335" y="320" width="52" height="48" fill="#eb6834"/><rect x="387" y="320" width="260" height="48" rx="4" fill="#2a78d6"/><text x="237.5" y="353" font-size="22" fill="#0b0b0b" font-weight="400" text-anchor="middle">门槛</text><text x="517" y="353" font-size="22" fill="#ffffff" font-weight="400" text-anchor="middle">余量</text><text x="36" y="412" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">同样一截，只占余量的一小块</text><rect x="36" y="470" width="648" height="48" rx="4" fill="#eb6834" stroke="none" stroke-width="2"/><text x="360" y="503" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">橙色：降温让门槛升高的那一截</text><text x="36" y="572" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">要比的是比例，不是绝对量。</text><text x="36" y="610" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">另一边的迁移率变化，比例和电压关系不大。</text>
</svg>
