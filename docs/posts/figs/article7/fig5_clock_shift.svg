<svg xmlns="http://www.w3.org/2000/svg" width="720" height="712" viewBox="0 0 720 712" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<rect width="720" height="712" fill="#fcfcfb"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="36" y="58" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start">时钟晚到：动一个和动全部</text><text x="36" y="100" font-size="24" fill="#52514e" font-weight="400" text-anchor="start">时钟都晚 0.3 ns，slack 变化，单位 ns</text><rect x="36" y="120" width="648" height="226" rx="10" fill="#dbe8f8" stroke="none" stroke-width="2"/><text x="56" y="164" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">只动 _12026_ 一个寄存器</text><text x="56" y="212" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start">收数据（自己的 D 端）</text><text x="420" y="212" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="Consolas,Menlo,'Courier New',monospace">11.185 →</text><text x="664" y="212" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="end" font-family="Consolas,Menlo,'Courier New',monospace">11.485</text><text x="56" y="256" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start">发数据（到 out_data[0]）</text><text x="420" y="256" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="Consolas,Menlo,'Courier New',monospace">22.048 →</text><text x="664" y="256" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="end" font-family="Consolas,Menlo,'Courier New',monospace">21.748</text><text x="56" y="320" font-size="24" fill="#52514e" font-weight="700" text-anchor="start">时间从后一段挪给前一段</text><rect x="36" y="362" width="648" height="226" rx="10" fill="#efeeea" stroke="none" stroke-width="2"/><text x="56" y="406" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">整个时钟一起动</text><text x="56" y="454" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start">全设计最差</text><text x="420" y="454" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="Consolas,Menlo,'Courier New',monospace">11.185 →</text><text x="664" y="454" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="end" font-family="Consolas,Menlo,'Courier New',monospace">11.185</text><text x="56" y="498" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start">到输出端口最差</text><text x="420" y="498" font-size="24" fill="#0b0b0b" font-weight="400" text-anchor="start" font-family="Consolas,Menlo,'Courier New',monospace">22.048 →</text><text x="664" y="498" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="end" font-family="Consolas,Menlo,'Courier New',monospace">22.048</text><text x="56" y="562" font-size="24" fill="#52514e" font-weight="700" text-anchor="start">launch、capture 都加 0.3，抵消</text><text x="36" y="626" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">基线有 27 个终点并列；只挪走一个，全设计最差仍是 11.185</text><text x="36" y="658" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">tt 1.80 V 25 °C；CASE-01 网表，Sky130 HD；T = 27.91 ns</text><text x="36" y="690" font-size="22" fill="#52514e" font-weight="400" text-anchor="start">理想时钟、不读寄生；延迟为手动设置，不是真实时钟树</text>
</svg>
